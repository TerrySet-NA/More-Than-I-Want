plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.25'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

repositories {
    maven {
        url "https://www.cursemaven.com"
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client { systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
    server { systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id; argument '--nogui' }
    gameTestServer { systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
    data { arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath() }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // 🥇 全宇宙最純淨：只留下 NeoForge 核心，其餘垃圾 AP 通通給老子滾蛋！
    implementation "net.neoforged:neoforge:${neo_version}"

    compileOnly "curse.maven:configured-457570:7276577"

    implementation "curse.maven:kaleidoscope-compat-1580791:9118946"

    implementation "curse.maven:kaleidoscope-cookery-1309203:9019242"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand replaceProperties }
}

publishing {
    publications { register('mavenJava', MavenPublication) { from components.java } }
    repositories { maven { url "file://${project.projectDir}/repo" } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 🧼 乾乾淨淨！沒有任何 compilerArgs 污染！
}

idea { module { downloadSources = true; downloadJavadoc = true } }